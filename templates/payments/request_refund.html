{% extends 'base.html' %}
{% block title %}Request Refund{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow border-warning">
    <div class="card-header bg-warning text-dark">
        <h5 class="mb-0">↩ Request Refund</h5>
    </div>
    <div class="card-body p-4">
        <div class="alert alert-info">
            <strong>Payment #{{ payment.id }}</strong><br>
            Amount: <strong>Rs. {{ payment.amount }}</strong><br>
            Appointment: #{{ payment.appointment.id }}
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Reason for Refund</label>
                {{ form.reason }}
            </div>
            <button type="submit" class="btn btn-warning w-100">Submit Refund Request</button>
            <a href="{% url 'payments:patient_payments' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
