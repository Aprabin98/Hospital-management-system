{% extends 'base.html' %}
{% block title %}Edit Schedule{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow">
    <div class="card-header bg-primary text-white"><h5>✏️ Edit Schedule</h5></div>
    <div class="card-body">
        <form method="POST">{% csrf_token %}
            {% for field in form %}
            <div class="mb-3"><label class="form-label fw-bold">{{ field.label }}</label>{{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'clinical:schedule_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
