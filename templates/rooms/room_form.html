{% extends 'base.html' %}
{% block title %}Room Form{% endblock %}
{% block content %}
<h3>{{ title }}</h3>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-secondary" href="{% url 'rooms:room_list' %}">Cancel</a>
</form>
{% endblock %}
