{% extends 'base.html' %}
{% block title %}Delete Template{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow border-danger">
    <div class="card-header bg-danger text-white"><h5>⚠️ Delete Test Template</h5></div>
    <div class="card-body text-center">
        <p>Delete <strong>{{ template.name }}</strong>? This will also delete all its fields and schedules!</p>
        <form method="POST">{% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'lab:template_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
