{% extends 'base.html' %}
{% block title %}Delete Doctor{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow border-danger">
    <div class="card-header bg-danger text-white"><h5>⚠️ Delete Doctor</h5></div>
    <div class="card-body text-center">
        <p>Are you sure you want to delete <strong>Dr. {{ doctor.user.username }}</strong>?</p>
        <p class="text-danger small">This will also delete their user account permanently!</p>
        <form method="POST">{% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'clinical:doctor_list_admin' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
</div></div>
{% endblock %}
